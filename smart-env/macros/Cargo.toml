[package]
name = "smart-env-macros"
version = "0.1.0"
edition = "2024"
description = "Type-safe, DX-focused environment configuration loader for Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PMStudio-Patryk-Matysiewicz/smart-env"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
smart-env-core = { path = "../core" }
temp-env = "0.3"
tempfile = "3"