[workspace]
members = ["core", "macros", "cli"]
resolver = "2"

[package]
name = "smart-env"
version = "0.1.0"
edition = "2024"
description = "A production-ready, type-safe environment configuration library for Rust"
license = "MIT OR Apache-2.0"

[dependencies]
smart-env-core = { path = "./core", version = "0.1.0" }
smart-env-macros = { path = "./macros", version = "0.1.0" }

[dev-dependencies]
temp-env = "0.3"