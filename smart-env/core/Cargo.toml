[package]
name = "smart-env-core"
version = "0.1.0"
edition = "2024"
description = "Type-safe, DX-focused environment configuration loader for Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PMStudio-Patryk-Matysiewicz/smart-env"

[dependencies]
thiserror = "2.0"
miette = { version = "7.0", features = ["fancy"] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
